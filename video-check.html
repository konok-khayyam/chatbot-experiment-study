<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0" />

  <title>Video Questions</title>

  <link rel="stylesheet"
        href="css/style.css" />

</head>

<body>

  <div class="page-container">

    <!-- Progress -->

    <div class="progress-wrapper">

      <div class="progress-bar">

        <div class="progress-fill"
             style="width: 78%">
        </div>

      </div>

      <p class="progress-text">
        Video Questions
      </p>

    </div>


    <!-- Main Card -->

    <div class="content-card">

      <h1 class="page-title">
        Video Questions
      </h1>


      <p class="page-description">

        Please answer the following questions about the video.

      </p>


      <!-- ================================= -->
      <!-- QUESTION 1 -->
      <!-- ================================= -->

      <div class="question-card">

        <div class="question-title">
          What was the general topic of the video?
        </div>


        <label class="radio-option">

          <input
            type="radio"
            name="video_topic"
            value="Social issue discussion"
          >

          Social issue discussion

        </label>


        <label class="radio-option">

          <input
            type="radio"
            name="video_topic"
            value="Cooking tutorial"
          >

          Cooking tutorial

        </label>


        <label class="radio-option">

          <input
            type="radio"
            name="video_topic"
            value="Sports highlights"
          >

          Sports highlights

        </label>


        <label class="radio-option">

          <input
            type="radio"
            name="video_topic"
            value="Travel vlog"
          >

          Travel vlog

        </label>

      </div>


      <!-- ================================= -->
      <!-- QUESTION 2 -->
      <!-- ================================= -->

      <div class="question-card">

        <div class="question-title">
          What format best describes the video?
        </div>


        <label class="radio-option">

          <input
            type="radio"
            name="video_format"
            value="Social media video"
          >

          Social media video

        </label>


        <label class="radio-option">

          <input
            type="radio"
            name="video_format"
            value="News article"
          >

          News article

        </label>


        <label class="radio-option">

          <input
            type="radio"
            name="video_format"
            value="Personal email"
          >

          Personal email

        </label>


        <label class="radio-option">

          <input
            type="radio"
            name="video_format"
            value="Academic lecture"
          >

          Academic lecture

        </label>

      </div>


      <!-- ================================= -->
      <!-- QUESTION 3 -->
      <!-- ================================= -->

      <div class="question-card">

        <div class="question-title">
          What was the speaker mainly trying to do?
        </div>


        <label class="radio-option">

          <input
            type="radio"
            name="video_goal"
            value="Explain neutral background issue"
          >

          Explain a neutral background issue

        </label>


        <label class="radio-option">

          <input
            type="radio"
            name="video_goal"
            value="Persuade viewers"
          >

          Persuade viewers toward a particular interpretation

        </label>


        <label class="radio-option">

          <input
            type="radio"
            name="video_goal"
            value="Sell product"
          >

          Sell a product

        </label>


        <label class="radio-option">

          <input
            type="radio"
            name="video_goal"
            value="Technical instructions"
          >

          Give technical instructions

        </label>

      </div>


      <!-- ================================= -->
      <!-- CONTINUE -->
      <!-- ================================= -->

      <div class="button-container">

        <button
          id="continueBtn"
          class="primary-button"
          type="button"
        >

          Continue

        </button>

      </div>

    </div>

  </div>


  <script>

    // =====================================
    // CONTINUE BUTTON
    // =====================================

    const continueBtn =
      document.getElementById(
        "continueBtn"
      );


    // =====================================
    // VALIDATE QUESTIONS
    // =====================================

    function validateQuestions() {

      const videoTopic =
        document.querySelector(
          'input[name="video_topic"]:checked'
        );


      const videoFormat =
        document.querySelector(
          'input[name="video_format"]:checked'
        );


      const videoGoal =
        document.querySelector(
          'input[name="video_goal"]:checked'
        );


      if (
        !videoTopic ||
        !videoFormat ||
        !videoGoal
      ) {

        alert(
          "Please answer all questions before continuing."
        );

        return false;

      }


      return true;

    }


    // =====================================
    // CONTINUE BUTTON
    // =====================================

    continueBtn.addEventListener(
      "click",
      async () => {


        // =================================
        // VALIDATE
        // =================================

        if (
          !validateQuestions()
        ) {

          return;

        }


        // =================================
        // GET ANSWERS
        // =================================

        const videoTopic =
          document.querySelector(
            'input[name="video_topic"]:checked'
          ).value;


        const videoFormat =
          document.querySelector(
            'input[name="video_format"]:checked'
          ).value;


        const videoGoal =
          document.querySelector(
            'input[name="video_goal"]:checked'
          ).value;


        // =================================
        // PREVENT DOUBLE CLICK
        // =================================

        continueBtn.disabled =
          true;

        continueBtn.innerText =
          "Please wait...";


        // =================================
        // SEND TO N8N
        // =================================

        try {

          const response =
            await fetch(
              "https://n8n.media.tuwien.ac.at/webhook/save-consent",
              {

                method: "POST",

                headers: {

                  "Content-Type":
                    "application/json"

                },


                body: JSON.stringify({

                  // -------------------------
                  // ACTION
                  // -------------------------

                  action:
                    "save_video_check",


                  // -------------------------
                  // PARTICIPANT ID
                  // -------------------------

                  session_id:
                    localStorage.getItem(
                      "session_id"
                    ),


                  // -------------------------
                  // VIDEO QUESTIONS
                  // -------------------------

                  video_topic:
                    videoTopic,

                  video_format:
                    videoFormat,

                  video_goal:
                    videoGoal

                })

              }
            );


          // =================================
          // CHECK SERVER RESPONSE
          // =================================

          if (
            !response.ok
          ) {

            throw new Error(
              "Server returned an error."
            );

          }


          // =================================
          // REDIRECT TO CHAT
          // =================================

          window.location.replace(
            "chat.html"
          );

        }


        catch (error) {

          console.error(
            "Error saving video comprehension:",
            error
          );


          // Re-enable button if saving fails

          continueBtn.disabled =
            false;

          continueBtn.innerText =
            "Continue";


          alert(
            "Error saving responses. Please try again."
          );

        }

      }
    );


    // =====================================
    // BLOCK BACK NAVIGATION
    // =====================================

    history.pushState(
      null,
      null,
      location.href
    );


    window.onpopstate =
      function () {

        history.go(1);

      };

  </script>

</body>

</html>
