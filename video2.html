<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0"/>

  <title>Video</title>

  <link rel="stylesheet"
        href="css/style.css" />

</head>

<body>

  <div class="page-container">

    <!-- Progress -->

    <div class="progress-wrapper">

      <div class="progress-bar">

        <div class="progress-fill"
             style="width: 66%">
        </div>

      </div>

      <p class="progress-text">
        Video
      </p>

    </div>

    <!-- Main Card -->

    <div class="content-card">

      <h1 class="page-title">
        Video
      </h1>

      <p class="page-description">

        Please watch the video carefully.

      </p>

      <!-- Video -->

      <div class="video-wrapper">

        <video
          id="studyVideo"
          playsinline
          preload="metadata">

          <source
            src="./prov.mp4"
            type="video/mp4">

          Your browser does not support the video element.

        </video>

      </div>

      <!-- Controls -->

      <div class="video-controls">

        <button
          id="playPauseBtn"
          class="primary-button">

          Play

        </button>

        <span id="timeDisplay">
          0:00 / 0:00
        </span>

      </div>

      <!-- Status -->

      <p id="videoStatus"
         class="video-status">

        Please watch the video to continue.

      </p>

      <!-- Continue -->

      <div class="button-container">

        <button
          id="continueBtn"
          class="primary-button"
          disabled>

          Continue

        </button>

      </div>

    </div>

  </div>


  <script>

    // =====================================
    // VIDEO VARIABLES
    // =====================================

    const video =
      document.getElementById("studyVideo");

    const playPauseBtn =
      document.getElementById("playPauseBtn");

    const continueBtn =
      document.getElementById("continueBtn");

    const videoStatus =
      document.getElementById("videoStatus");

    const timeDisplay =
      document.getElementById("timeDisplay");


    let trackingInterval;

    let videoStarted = false;

    let videoCompleted = false;

    let videoStartTimestamp = null;

    let videoEndTimestamp = null;

    let watchTime = 0;

    let pauseCount = 0;

    let rewatchCount = 0;

    let maxWatchedSecond = 0;

    let previousSecond = 0;

    let videoDuration = 0;

    let hiddenStartTime = null;

    let videoHiddenTime = 0;

    let autoPaused = false;


    // =====================================
    // VIDEO METADATA
    // =====================================

    video.addEventListener(
      "loadedmetadata",
      () => {

        videoDuration =
          video.duration;

        updateTimeDisplay();

      }
    );


    // =====================================
    // PLAY / PAUSE BUTTON
    // =====================================

    playPauseBtn.addEventListener(
      "click",
      () => {

        if (video.paused) {

          video.play();

        } else {

          video.pause();

        }

      }
    );


    // =====================================
    // PLAY EVENT
    // =====================================

    video.addEventListener(
      "play",
      () => {

        playPauseBtn.innerText =
          "Pause";

        if (!videoStarted) {

          videoStarted = true;

          videoStartTimestamp =
            new Date().toISOString();

        }

        startTracking();

        videoStatus.innerText =
          "Video is playing.";

      }
    );


    // =====================================
    // PAUSE EVENT
    // =====================================

    video.addEventListener(
      "pause",
      () => {

        playPauseBtn.innerText =
          "Play";

        if (!autoPaused) {

          pauseCount++;

        }

        autoPaused = false;

        clearInterval(
          trackingInterval
        );

      }
    );


    // =====================================
    // VIDEO ENDED
    // =====================================

    video.addEventListener(
      "ended",
      () => {

        clearInterval(
          trackingInterval
        );

        videoEndTimestamp =
          new Date().toISOString();

        maxWatchedSecond =
          videoDuration;

        videoCompleted = true;

        continueBtn.disabled =
          false;

        playPauseBtn.innerText =
          "Play";

        videoStatus.innerText =
          "Video completed. You may continue.";

        updateTimeDisplay();

      }
    );


    // =====================================
    // TIME DISPLAY
    // =====================================

    video.addEventListener(
      "timeupdate",
      updateTimeDisplay
    );


    function updateTimeDisplay() {

      const current =
        Math.floor(video.currentTime || 0);

      const duration =
        Math.floor(video.duration || 0);

      const currentMinutes =
        Math.floor(current / 60);

      const currentSeconds =
        String(current % 60)
          .padStart(2, "0");

      const durationMinutes =
        Math.floor(duration / 60);

      const durationSeconds =
        String(duration % 60)
          .padStart(2, "0");

      timeDisplay.innerText =
        `${currentMinutes}:${currentSeconds} / ${durationMinutes}:${durationSeconds}`;

    }


    // =====================================
    // TRACK WATCHING
    // =====================================

    function startTracking() {

      clearInterval(
        trackingInterval
      );

      trackingInterval =
        setInterval(
          () => {

            if (
              video.paused ||
              video.ended ||
              document.visibilityState === "hidden"
            ) {

              return;

            }


            const currentSecond =
              video.currentTime;


            // WATCH TIME

            watchTime++;


            // REWATCH DETECTION

            if (
              currentSecond <
              previousSecond - 2
            ) {

              rewatchCount++;

            }


            previousSecond =
              currentSecond;


            // MAXIMUM WATCHED POSITION

            if (
              currentSecond >
              maxWatchedSecond
            ) {

              maxWatchedSecond =
                currentSecond;

            }


            // WATCH PERCENTAGE

            const watchPercentage =
              videoDuration > 0

                ? (
                    maxWatchedSecond /
                    videoDuration
                  ) * 100

                : 0;


            // ENABLE AT 98%

            if (
              watchPercentage >= 98 &&
              !videoCompleted
            ) {

              videoCompleted = true;

              continueBtn.disabled =
                false;

              videoStatus.innerText =
                "Video completed. You may continue.";

            }

          },
          1000
        );

    }


    // =====================================
    // TAB VISIBILITY TRACKING
    // =====================================

    document.addEventListener(
      "visibilitychange",
      () => {

        // USER LEFT TAB

        if (
          document.visibilityState === "hidden"
        ) {

          if (!videoStarted) {

            return;

          }


          hiddenStartTime =
            Date.now();


          // AUTO-PAUSE VIDEO

          if (
            video &&
            !video.paused &&
            !video.ended
          ) {

            autoPaused = true;

            video.pause();

          }

        }


        // USER RETURNED

        else if (
          document.visibilityState === "visible"
        ) {

          if (hiddenStartTime) {

            videoHiddenTime +=
              Math.floor(
                (
                  Date.now() -
                  hiddenStartTime
                ) / 1000
              );

          }

          hiddenStartTime =
            null;


          videoStatus.innerText =
            "Please press Play to continue watching.";

        }

      }
    );


    // =====================================
    // CONTINUE BUTTON
    // =====================================

    continueBtn.addEventListener(
      "click",
      async () => {

        try {

          // FINAL WATCH PERCENTAGE

          const watchPercentage =
            videoDuration > 0

              ? (
                  maxWatchedSecond /
                  videoDuration
                ) * 100

              : 0;


          // VIDEO END TIME

          if (!videoEndTimestamp) {

            videoEndTimestamp =
              new Date().toISOString();

          }


          // VIDEO COMPLETED TIMESTAMP

          const videoCompletedTimestamp =
            new Date().toISOString();


          // =====================================
          // SEND VIDEO METRICS TO N8N
          // =====================================

          await fetch(
            "https://n8n.media.tuwien.ac.at/webhook/save-consent",
            {

              method: "POST",

              headers: {

                "Content-Type":
                  "application/json"

              },

              body: JSON.stringify({

                action:
                  "save_video_metrics",

                session_id:
                  localStorage.getItem(
                    "session_id"
                  ),

                video_start_timestamp:
                  videoStartTimestamp,

                video_end_timestamp:
                  videoEndTimestamp,

                video_duration:
                  Math.round(
                    videoDuration
                  ),

                watch_time:
                  watchTime,

                watch_percentage:
                  Math.round(
                    watchPercentage
                  ),

                rewatch_count:
                  rewatchCount,

                pause_count:
                  pauseCount,

                video_condition_id:
                  localStorage.getItem(
                    "video_condition"
                  ),

                video_completed:
                  videoCompleted
                    ? "yes"
                    : "no",

                video_completed_timestamp:
                  videoCompletedTimestamp

              })

            }
          );


          // =====================================
          // REDIRECT
          // =====================================

          window.location.replace(
            "chat.html"
          );

        }

        catch (error) {

          console.error(error);

          alert(
            "Error saving video data. Please try again."
          );

        }

      }
    );


    // =====================================
    // BACK BUTTON BLOCK
    // =====================================

    history.pushState(
      null,
      null,
      location.href
    );

    window.onpopstate =
      function () {

        history.go(1);

      };

  </script>

</body>

</html>
